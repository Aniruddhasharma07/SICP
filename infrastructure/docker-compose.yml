version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: sicp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sicp
      POSTGRES_PASSWORD: sicp_secure_password_2026
      POSTGRES_DB: sicp_db
    ports:
      - "5432:5432"
    volumes:
      - sicp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicp -d sicp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sicp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sicp_redisdata:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sicp_pgdata:
    driver: local
  sicp_redisdata:
    driver: local